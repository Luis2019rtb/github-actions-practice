name: Practicing outputs
run-name: outputs-practice
on:
  push:
    branches: [main]
jobs:
  handle-job-outputs:
    name: Output practice job
    runs-on: ubuntu-slim
    outputs:
      firstoutput: ${{ steps.step1.outputs.test }}
      secondoutput: ${{ steps.step2.outputs.test }}
    steps:
      - name: Generating first output step
        id: step1
        run: echo "test=hello" >> "$GITHUB_OUTPUT"

      - name: Generating second output step
        id: step2
        run: echo "test=world" >> "$GITHUB_OUTPUT"

      - name: showing outputs
        env:
          OUTPUT1: ${{ steps.step1.outputs.test }}
          OUTPUT2: ${{ steps.step2.outputs.test }}
        run: |
          echo "Number: $OUTPUT1 Number2: $OUTPUT2 "
  handle-first-job-outputs:
    name: Showing output practice from first job
    runs-on: ubuntu-slim
    needs: [handle-job-outputs]
    steps:
      - name: Showing first jobs outputs
        env:
          FIRST_JOB_OUTPUT: ${{ needs.handle-job-outputs.outputs.firstoutput }}
          SECOND_JOB_OUTPUT: ${{ needs.handle-job-outputs.outputs.secondoutput }}
        run: echo "$FIRST_JOB_OUTPUT $SECOND_JOB_OUTPUT"
